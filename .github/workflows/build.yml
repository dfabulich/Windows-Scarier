name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        shell: cmd
        run: .\build.cmd -Configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: Scarier
          path: bin/Release/Scarier.exe

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Scarier

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          $zip = "windows-scarier-$env:TAG.zip"
          Compress-Archive -Path Scarier.exe -DestinationPath $zip
          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:TAG $zip --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $env:TAG $zip --title $env:TAG --generate-notes --repo $env:GITHUB_REPOSITORY
          }
          exit $LASTEXITCODE
